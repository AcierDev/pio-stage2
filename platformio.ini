[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

;; USB Upload Configuration (current default for development)
upload_protocol = esptool
; upload_port = /dev/cu.usbmodem5A4E1311771  ; Let auto-detection handle this

;; OTA Upload Configuration (uncomment lines below and comment USB config above for OTA)
; upload_protocol = espota
; upload_port = 192.168.1.251
; upload_flags = --port=3232

lib_deps =
    gin66/FastAccelStepper
    thomasfredericks/Bounce2
    bblanchon/ArduinoJson@^7.4.1